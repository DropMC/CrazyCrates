name: dropmc-publish

# Publishes the shaded paper jar as gg.dropmc.crazycrates:crazycrates-paper, which the DropMC survival modules
# compile against. A dropmc-v<version> tag publishes that version; a push to dropmc publishes dropmc-SNAPSHOT.
on:
  push:
    branches: [dropmc]
    tags: ['dropmc-v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: resolve version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME#dropmc-v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=dropmc-SNAPSHOT" >> "$GITHUB_OUTPUT"
          fi

      - name: publish
        run: ./gradlew :paper:publishDropmcPublicationToGitHubPackagesRepository -PdropmcVersion=${{ steps.version.outputs.value }}
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
